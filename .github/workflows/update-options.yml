name: Update Options Data

# A single long-lived job refreshes every 10 min during A-share trading hours
# (see scripts/run_loop.py) and re-dispatches itself when it times out.
# GitHub cron is unreliable (fires hours late), so it's kept only to restart
# the chain if it ever breaks; extra triggers just queue behind the running job.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-options
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh loop
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_loop.py

      - name: Hand off to next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-options.yml --ref main
